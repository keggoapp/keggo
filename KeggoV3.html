    body.theme-chalkboard .filter-shell:not(:has(+ .cat-chips, + .cat-chips-subrow, + .cat-chips-more, + .cat-chips-sport)) {
      border-radius: 18px;
      border-bottom: 2.5px solid var(--ink);
      box-shadow: none;
      margin: 0 0 32px;
    }
    body.theme-chalkboard .filter-shell::before {
      content: "what'll it be?";
      position: absolute; top: 22px; left: 22px;
      font-family: var(--font-hand); font-size: 26px; font-weight: 700;
      color: var(--honey); transform: rotate(-2deg);
      pointer-events: none; z-index: 2;
      background: transparent; padding: 0;
      line-height: 1;
    }
    /* A-board controls — transparent on the grainy panel with cream outlines
       and cream/honey type, so the chalkboard grain reads through (canonical
       demo-filter-shell). Active/selected states invert to a bright cream chip. */
    body.theme-chalkboard .filter-shell .search-input-wrap input,
    body.theme-chalkboard .filter-shell .filter-select,
    body.theme-chalkboard .filter-shell .location-input {
      background: transparent;
      color: var(--cream);
      border: 1.5px solid var(--cream);
    }
    body.theme-chalkboard .filter-shell .search-input-wrap input { font-size: 14px; padding: 12px 16px 12px 42px; }
    body.theme-chalkboard .filter-shell .search-input-wrap input::placeholder,
    body.theme-chalkboard .filter-shell .location-input::placeholder { color: rgba(242,228,196,0.55); }
    body.theme-chalkboard .filter-shell .search-input-wrap input:focus,
    body.theme-chalkboard .filter-shell .location-input:focus { box-shadow: 3px 3px 0 var(--tomato); }
    body.theme-chalkboard .filter-shell .search-input-wrap svg { color: var(--cream); opacity: 0.7; }
    body.theme-chalkboard .filter-shell .location-btn { background: transparent; color: var(--honey); border: 1.5px solid var(--cream); box-shadow: none; }
    @media (hover: hover){body.theme-chalkboard .filter-shell .location-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    body.theme-chalkboard .filter-shell .location-btn svg { color: var(--tomato); }
    body.theme-chalkboard .filter-shell .clear-btn { background: transparent; color: var(--cream); border: 1.5px solid var(--cream); }
    @media (hover: hover){body.theme-chalkboard .filter-shell .clear-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); background: transparent; color: var(--cream); border-color: var(--cream); }}
    body.theme-chalkboard .filter-shell .date-preset-btn { background: transparent; color: var(--cream); border: 1.5px solid var(--cream); }
    body.theme-chalkboard .filter-shell .date-preset-btn.active { background: var(--ink); color: var(--honey); border-color: var(--ink); box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px); }
    body.theme-chalkboard .filter-shell .date-slider-btn { background: transparent; color: var(--cream); border: 1.5px solid rgba(242,228,196,0.22); }
    @media (hover: hover){body.theme-chalkboard .filter-shell .date-slider-btn:hover:not(:disabled) { border-color: var(--cream); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    body.theme-chalkboard .filter-shell .radius-row {
      background: transparent; color: var(--cream);
      border: 1.5px solid rgba(242,228,196,0.22);
      padding: 8px 14px; font-size: 14px;
    }
    body.theme-chalkboard .filter-shell .radius-row svg { color: var(--cream); opacity: 0.6; }
    body.theme-chalkboard .filter-shell .radius-slider { background: rgba(242,228,196,0.25); }
    body.theme-chalkboard .filter-shell .radius-slider::-webkit-slider-thumb { width: 14px; height: 14px; background: var(--cream); border: 1.5px solid var(--ink); }
    body.theme-chalkboard .filter-shell .radius-slider::-moz-range-thumb { width: 14px; height: 14px; background: var(--cream); border: 1.5px solid var(--ink); }
    /* Date tiles — transparent with cream outline + honey numeral; the
       selected tile inverts to a cream chip with a tomato numeral. */
    body.theme-chalkboard .date-tile { background: transparent; color: var(--cream); border: 1.5px solid var(--cream); }
    body.theme-chalkboard .date-tile .date-tile-num { color: var(--honey); }
    @media (hover: hover){body.theme-chalkboard .date-tile:hover { background: transparent; transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    body.theme-chalkboard .date-tile.active { background: var(--ink); border-color: var(--ink); color: var(--honey); box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px); }
    body.theme-chalkboard .date-tile.active .date-tile-num,
    body.theme-chalkboard .date-tile.active .date-tile-day,
    body.theme-chalkboard .date-tile.active .date-tile-mon { color: var(--honey); opacity: 1; }

    /* CATEGORY DRAWER — merges visually with the filter shell as one
       continuous A-board panel. The last visible chip row picks up the
       rounded bottom and honey shadow via CSS :has() sibling check. */
    body.theme-chalkboard .cat-chips,
    body.theme-chalkboard .cat-chips-subrow,
    body.theme-chalkboard .cat-chips-more {
      background-color: var(--ink); color: var(--cream);
      background-image: var(--chalk-noise);
      background-size: 240px 240px;
      background-blend-mode: screen;
      border-left: 2.5px solid var(--ink);
      border-right: 2.5px solid var(--ink);
      border-bottom: 2.5px solid var(--ink);
      border-radius: 0 0 18px 18px;
      box-shadow: none;
      margin: 0 0 32px 0;
      padding: 14px 20px;
    }
    /* Sport sub-row — same grainy-ink drawer treatment as the other
       category rows so the whole panel reads as a continuous A-board. */
    body.theme-chalkboard .cat-chips-sport {
      background-color: var(--ink); color: var(--cream);
      background-image: var(--chalk-noise);
      background-size: 240px 240px;
      background-blend-mode: screen;
      border-left: 2.5px solid var(--ink);
      border-right: 2.5px solid var(--ink);
      border-bottom: 2.5px solid var(--ink);
      border-radius: 0 0 18px 18px;
      box-shadow: none;
      margin: 0 0 32px 0;
      padding: 14px 20px;
    }
    /* if a chip row is followed by another chip row, drop its rounded
       bottom + shadow so they read as one drawer */
    body.theme-chalkboard .cat-chips:has(+ .cat-chips-subrow),
    body.theme-chalkboard .cat-chips:has(+ .cat-chips-sport),
    body.theme-chalkboard .cat-chips:has(+ .cat-chips-more),
    body.theme-chalkboard .cat-chips-subrow:has(+ .cat-chips-sport),
    body.theme-chalkboard .cat-chips-subrow:has(+ .cat-chips-more),
    body.theme-chalkboard .cat-chips-sport:has(+ .cat-chips-more) {
      border-bottom: 1.5px dashed rgba(242,228,196,0.22);
      border-radius: 0;
      box-shadow: none;
      margin-bottom: 0;
    }
    /* WIZARD CATEGORY PANEL — standalone board (no filter shell above to merge
       with), so it gets rounded corners on ALL sides, not just the bottom. */
    body.theme-chalkboard .cat-chips.wizard-cat-chips {
      border-top: 2.5px solid var(--ink);
      border-radius: 18px;
    }
    /* In-place sub-row inherits the panel's grainy ink; chalk-dashed rules
       frame it like the explore drawer's row separators. */
    body.theme-chalkboard .wizard-cat-subrow {
      border-top-color: rgba(242,228,196,0.22);
      border-bottom-color: rgba(242,228,196,0.22);
    }
    /* Chips on the dark board — transparent with a cream outline + cream
       text; active keeps the chip on the board (no fill) with honey text on
       the hard tomato offset shadow. Matches §10 .demo-filter-shell .cat-chip. */
    body.theme-chalkboard .cat-chips .cat-chip,
    body.theme-chalkboard .cat-chips-subrow .cat-chip,
    body.theme-chalkboard .cat-chips-more .cat-chip,
    body.theme-chalkboard .cat-chips-sport .cat-chip {
      background: transparent; color: var(--cream); border-color: var(--cream);
    }
    @media (hover: hover){body.theme-chalkboard .cat-chips .cat-chip:hover,
    body.theme-chalkboard .cat-chips-subrow .cat-chip:hover,
    body.theme-chalkboard .cat-chips-more .cat-chip:hover,
    body.theme-chalkboard .cat-chips-sport .cat-chip:hover {
      background: transparent; color: var(--cream); border-color: var(--cream);
      box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px);
    }}
    body.theme-chalkboard .cat-chips .cat-chip.active,
    body.theme-chalkboard .cat-chips-subrow .cat-chip.active,
    body.theme-chalkboard .cat-chips-more .cat-chip.active,
    body.theme-chalkboard .cat-chips-sport .cat-chip.active {
      background: transparent; color: var(--honey); border-color: var(--cream);
      box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px);
    }
    /* Icons keep their native brand palette on the cream lozenge (base
       .cat-chip img) — the lozenge lifts the icon off the dark board. */
    body.theme-chalkboard .cat-chips .cat-chip img,
    body.theme-chalkboard .cat-chips-subrow .cat-chip img,
    body.theme-chalkboard .cat-chips-more .cat-chip img,
    body.theme-chalkboard .cat-chips-sport .cat-chip img { filter: none; }

    /* ───────────────────────────────────────────────────────────────
       SHADOW RESET — only the hero keeps its default offset shadow.
       Everything else loses the default and picks up the shadow on
       hover (and on selected/active state for filter chips). Aligns
       all shadows to a consistent +x +y offset direction for unity.
       ─────────────────────────────────────────────────────────────── */
    body.theme-chalkboard .card,
    body.theme-chalkboard .venue-card,
    body.theme-chalkboard .list-item,
    body.theme-chalkboard .map-wrap,
    body.theme-chalkboard .map-event-chip,
    body.theme-chalkboard .modal,
    body.theme-chalkboard .detail-modal,
    body.theme-chalkboard .modal-close,
    body.theme-chalkboard .modal-nav-arrow,
    body.theme-chalkboard .form-submit,
    body.theme-chalkboard .btn-primary,
    body.theme-chalkboard .btn-ghost,
    body.theme-chalkboard .location-btn,
    body.theme-chalkboard .nav-pill,
    body.theme-chalkboard .header-venue-btn,
    body.theme-chalkboard .filter-shell,
    body.theme-chalkboard .cat-chips,
    body.theme-chalkboard .cat-chips-subrow,
    body.theme-chalkboard .cat-chips-more,
    body.theme-chalkboard .cat-chips-sport,
    body.theme-chalkboard .cat-chip,
    body.theme-chalkboard .filter-shell .clear-btn,
    body.theme-chalkboard .filter-shell .date-preset-btn,
    body.theme-chalkboard .filter-shell .date-slider-btn,
    body.theme-chalkboard .view-btns,
    body.theme-chalkboard .events-table,
    body.theme-chalkboard .profile-card,
    body.theme-chalkboard .form-panel,
    body.theme-chalkboard .empty,
    body.theme-chalkboard .list-item-img,
    body.theme-chalkboard .card-icon-badge {
      box-shadow: none;
    }
    /* Rest-shadow exemptions (Brand Guidelines-6 §04; see DESIGN.md): the empty state is a
       "live thing" — it keeps a permanent 8px tomato rest shadow. The hero,
       the detail modal and the active map chip are the other three (the
       detail-modal exemption is declared later, after the modal flattening). */
    body.theme-chalkboard .empty,
    body.theme-chalkboard .dash-empty { box-shadow: 8px 8px 0 var(--tomato); }
    /* Hover-only shadows — tomato is the primary backdrop drop colour.
       Black-and-yellow stays in the chrome (icon badge, type, accents);
       the shadow is what gives the page its orange edge. */
    @media (hover: hover){body.theme-chalkboard .card:hover,
    body.theme-chalkboard .venue-card:hover {
      box-shadow: 6px 6px 0 var(--tomato);
      transform: translate(-2px,-2px);
    }}
    @media (hover: hover){body.theme-chalkboard .list-item:hover {
      box-shadow: 6px 6px 0 var(--tomato);
      transform: translate(-2px,-2px);
    }}
    body.theme-chalkboard .map-event-chip.active {
      box-shadow: 3px 3px 0 var(--tomato);
      border-color: var(--tomato);
    }
    @media (hover: hover){body.theme-chalkboard .map-event-chip:hover {
      box-shadow: 3px 3px 0 var(--tomato);
      border-color: var(--tomato);
    }}
    @media (hover: hover){body.theme-chalkboard .modal-close:hover {
      box-shadow: 3px 3px 0 var(--tomato);
    }}
    @media (hover: hover){body.theme-chalkboard .modal-nav-arrow:hover:not([disabled]) {
      box-shadow: 2px 2px 0 var(--tomato);
    }}
    @media (hover: hover){body.theme-chalkboard .form-submit:hover,
    body.theme-chalkboard .btn-primary:hover {
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    @media (hover: hover){body.theme-chalkboard .btn-ghost:hover {
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    @media (hover: hover){body.theme-chalkboard .location-btn:hover {
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    @media (hover: hover){body.theme-chalkboard .nav-pill:hover { box-shadow: none; }}
    @media (hover: hover){body.theme-chalkboard .header-venue-btn:hover { box-shadow: 3px 3px 0 var(--tomato); }}
    @media (hover: hover){body.theme-chalkboard .cat-chip:hover {
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    /* Active/selected states are flat — no offset shadow, just colour change.
       Exception: the Live Sport filter sub-row's active chip keeps the tomato
       offset shadow (via the .cat-chips-sport .cat-chip.active rule above) so it
       matches the other filter sub-rows — it's intentionally NOT flattened here. */
    body.theme-chalkboard .nav-pill.active,
    body.theme-chalkboard .cat-chip.active,
    body.theme-chalkboard .filter-shell .cat-chip.active,
    body.theme-chalkboard .filter-shell {
      box-shadow: none;
    }
    /* …but inside the event-creation wizard, selected chips (family AND
       in-place sub-row) keep the tomato offset shadow. The flat-active
       treatment above is only meant for the dark filter shell. */
    body.theme-chalkboard .wizard-cat-chips .cat-chip.active {
      box-shadow: 3px 3px 0 var(--tomato);
    }
    /* …but the date-picker tile for "today" keeps a 2 px tomato hint
       since it's the only way to tell which is today inside the menu */
    body.theme-chalkboard .date-tile.is-today:not(.active) {
      background: transparent; color: var(--cream);
      border-color: var(--tomato); border-width: 1.5px;
      box-shadow: none;
    }

    /* RESULTS BAR — clean count + view toggles, with a subtle dashed chalk underline */
    body.theme-chalkboard .results-bar {
      position: relative;
      padding: 14px 0 14px;
      margin: 8px 0 22px;
      border-bottom: 0;
    }
    body.theme-chalkboard .results-bar::after {
      /* dashed chalk underline */
      content: ""; position: absolute;
      bottom: 0; left: 0; right: 0; height: 4px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 4' preserveAspectRatio='none'><path d='M2 2 L10 2 M16 2 L24 2' stroke='%231A1715' stroke-width='1.6' stroke-linecap='round'/></svg>");
      background-size: 30px 4px; background-repeat: repeat-x;
    }
    body.theme-chalkboard .results-bar .count {
      font-family: var(--font-display); font-size: 14px; font-weight: 600;
      letter-spacing: -0.005em; text-transform: none;
    }
    body.theme-chalkboard .results-bar .count strong { color: var(--ink); font-weight: 800; }
    /* View toggle — bolder, with a tomato drop on hover and a stronger
       active fill so the grid/list/map switch reads clearly. */
    body.theme-chalkboard .view-btns {
      background: var(--cream); border: 2.5px solid var(--ink);
      padding: 4px; border-radius: 100px;
      box-shadow: none;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    @media (hover: hover){body.theme-chalkboard .view-btns:hover {
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    body.theme-chalkboard .view-btn {
      width: 38px; height: 38px;
      color: var(--ink-soft);
      transition: background var(--transition), color var(--transition);
    }
    @media (hover: hover){body.theme-chalkboard .view-btn:hover:not(.active) {
      background: rgba(26,23,21,0.08);
      color: var(--ink);
    }}
    body.theme-chalkboard .view-btn.active {
      background: var(--ink); color: var(--honey);
    }

    /* CARDS — clean grid tiles. Caveat for event titles (one of the brand's
       "one-line hype phrases" allowances). Cream icon badges so the chalk
       icons read clearly. No yellow pin/tape — the chalk-direction stays
       in the hero/footer, the cards stay clean. */
    body.theme-chalkboard .card { box-shadow: none; position: relative; }
    @media (hover: hover){body.theme-chalkboard .card:hover {
      box-shadow: 6px 6px 0 var(--tomato);
    }}
    /* Ink icon badge — bold, prominent sticker on the dark tile.
       Shadow appears on card hover only. */
    body.theme-chalkboard .card-icon-badge {
      background: var(--cream); border-color: var(--ink);
      box-shadow: none;
      width: 60px; height: 60px;
      top: 14px; left: 14px;
      border-radius: 14px;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    @media (hover: hover){body.theme-chalkboard .card:hover .card-icon-badge {
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    body.theme-chalkboard .card-icon-badge svg,
    body.theme-chalkboard .card-icon-badge img { filter: none; width: 38px; height: 38px; }

    /* CAVEAT EVENT TITLES — keeps Fredoka usage down, gives event titles
       a chalk-handwritten feel matching the A-board direction. Brand
       allows Caveat for short one-line phrases — event titles qualify. */
    body.theme-chalkboard .card-title {
      font-family: var(--font-hand); font-weight: 700;
      font-size: 28px; line-height: 1.05; letter-spacing: 0;
      color: var(--ink); margin-top: 10px; margin-bottom: 10px;
    }
    body.theme-chalkboard .card-title em {
      font-family: var(--font-hand); font-style: normal;
      color: var(--honey); font-size: 1em;
    }
    /* Card content rhythm — breathe out the stacked title/venue/area/
       services/meta block so the tile doesn't feel cramped. */
    body.theme-chalkboard .card .card-content {
      padding: 20px 22px 22px;
    }
    body.theme-chalkboard .card .card-cat-tag { margin-bottom: 0; }
    body.theme-chalkboard .card .card-venue-area { margin-top: 4px; margin-bottom: 10px; }
    body.theme-chalkboard .card .card-venue-services { margin: 0 0 14px; }
    body.theme-chalkboard .card .card-meta {
      display: flex; flex-wrap: wrap; gap: 6px 14px;
      margin-top: 8px; margin-bottom: 0;
      align-items: center;
    }
    /* Lift the save badge out of the bottom row and pin it to the
       top-right corner of the card content — keeps it above-the-fold
       and out of the meta row's way. */
    body.theme-chalkboard .card .card-badges {
      position: absolute;
      top: 14px; right: 14px;
      margin: 0;
      z-index: 3;
    }

    /* PAGINATION arrows — chalk feel */
    body.theme-chalkboard .events-pagination { padding-top: 20px; }

    /* MAP VIEW — bigger map, ink frame, tomato drop, dark sidebar */
    body.theme-chalkboard .map-wrap {
      grid-template-columns: 1fr 320px;
      height: 660px;
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 6px 6px 0 var(--tomato);
      overflow: hidden;
      background: var(--ink);
    }
    body.theme-chalkboard .map-frame { z-index: 1; }
    body.theme-chalkboard .map-sidebar {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen; color: var(--cream);
      border-left: 3px solid var(--ink); /* impeccable-disable-line side-tab -- the divider between the map and its list, not an accent stripe */
      padding: 12px;
      max-height: 660px;
    }
    body.theme-chalkboard .map-event-chip {
      background: var(--cream); color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 14px;
      box-shadow: none;
      padding: 10px; margin: 0 6px 16px 0;
      transition: box-shadow 0.18s ease, transform 0.18s ease;
    }
    body.theme-chalkboard .map-event-chip.active {
      background: var(--cream); border-color: var(--ink);
      box-shadow: 4px 4px 0 var(--tomato);
      transform: translate(-2px,-2px);
    }
    @media (hover: hover){body.theme-chalkboard .map-event-chip:hover {
      background: var(--cream); border-color: var(--ink);
      box-shadow: 4px 4px 0 var(--tomato);
      transform: translate(-2px,-2px);
    }}
    body.theme-chalkboard .map-event-chip-title {
      font-family: var(--font-hand); font-weight: 700;
      font-size: 20px; color: var(--ink); line-height: 1.05;
      letter-spacing: 0; margin-bottom: 2px;
    }
    body.theme-chalkboard .map-event-chip-venue { color: var(--ink); }
    /* Map empty state — the chalk message sits inside the board under the map
       (no separate box), so it reads as one panel when nothing's on nearby. */
    .map-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; height: 100%; min-height: 240px; padding: 40px 26px; gap: 4px;
    }
    .map-empty-hand {
      font-family: var(--font-hand); font-weight: 700; color: var(--honey);
      font-size: 34px; line-height: 1.05; transform: rotate(-2deg); margin-bottom: 6px;
      text-shadow: 0 0 1px rgba(244,185,68,0.4);
    }
    .map-empty h3 {
      font-family: var(--font-display); font-weight: 700; color: var(--cream);
      font-size: 22px; letter-spacing: -0.018em; margin: 0;
    }
    .map-empty p {
      font-family: var(--font-body); color: rgba(242,228,196,0.85);
      font-size: 14px; line-height: 1.5; max-width: 32ch; margin: 4px 0 0;
    }
    @media (max-width: 768px) {
      body.theme-chalkboard .map-wrap {
        grid-template-columns: 1fr;
        grid-template-rows: 380px 1fr;
        height: 720px;
        box-shadow: 6px 6px 0 var(--tomato);
      }
      body.theme-chalkboard .map-sidebar {
        border-left: 0; border-top: 3px solid var(--ink);
        max-height: none; min-height: 0;
      }
    }
    /* Google Maps InfoWindow override — chalk-card style on hover */
    body.theme-chalkboard .gm-style .gm-style-iw-c {
      padding: 0 !important;
      border-radius: 14px !important;
      border: 2.5px solid var(--ink) !important;
      box-shadow: 3px 3px 0 var(--tomato) !important;
      background: var(--cream) !important;
      max-width: 280px !important;
      overflow: hidden !important;
    }
    body.theme-chalkboard .gm-style .gm-style-iw-d { overflow: visible !important; }
    body.theme-chalkboard .gm-style .gm-style-iw-tc { display: none; }
    body.theme-chalkboard .gm-style .gm-ui-hover-effect { display: none !important; }

    /* LIST VIEW — pushed to feel like a "what's on" gazette listing.
       Bigger poster image, Caveat title in matching chalk hand, honey
       date sticker, tomato click-arrow on the right, more breathing room.
       Default shadow is dropped — only appears on hover. */
    body.theme-chalkboard .events-list { gap: 18px; }
    body.theme-chalkboard .list-item {
      background: var(--tile); border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 14px 48px 14px 14px;
      gap: 18px; align-items: stretch;
      box-shadow: none;
      position: relative; overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    @media (hover: hover){body.theme-chalkboard .list-item:hover {
      transform: translate(-2px,-2px);
      box-shadow: 7px 7px 0 var(--tomato);
      border-color: var(--ink);
    }}
    body.theme-chalkboard .list-item-img {
      width: 240px;
      height: auto; align-self: stretch;
      min-height: 180px;
      border-radius: 12px;
      border: 2.5px solid var(--ink);
      box-shadow: none;
      flex-shrink: 0;
      object-fit: cover;
      transition: box-shadow 0.18s ease;
    }
    @media (hover: hover){body.theme-chalkboard .list-item:hover .list-item-img {
      box-shadow: 3px 3px 0 var(--tomato);
    }}
    body.theme-chalkboard .list-item-body {
      padding: 4px 0;
      display: flex; flex-direction: column; gap: 4px;
      flex: 1; min-width: 0;
    }
    body.theme-chalkboard .list-item-title {
      font-family: var(--font-hand); font-weight: 700;
      font-size: 32px; line-height: 1.02; letter-spacing: 0;
      color: var(--ink); margin-bottom: 4px;
    }
    body.theme-chalkboard .list-item-venue {
      font-family: var(--font-display); font-weight: 700;
      font-size: 22px; color: var(--ink-soft);
    }
    body.theme-chalkboard .list-item-area {
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    body.theme-chalkboard .list-item-services .mini-tag {
      background: transparent; color: var(--cream); border-color: var(--cream);
    }
    body.theme-chalkboard .list-item-meta {
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-soft); margin: 6px 0 6px;
    }
    body.theme-chalkboard .list-item-desc {
      font-family: var(--font-body); font-size: 14px;
      line-height: 1.55; color: var(--ink-soft);
    }
    /* "→" click-arrow at the right edge of every list item — cream by
       default with no shadow; flips to ink + honey with a tomato drop
       only when the user hovers the list item. */
    body.theme-chalkboard .list-item::after {
      content: ""; position: absolute;
      top: 50%; right: 14px; transform: translateY(-50%);
      width: 30px; height: 30px;
      background-color: var(--cream);
      background-position: center; background-size: 16px 16px; background-repeat: no-repeat;
      border: 2px solid var(--ink); border-radius: 50%;
      box-shadow: none;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }
    @media (hover: hover){body.theme-chalkboard .list-item:hover::after {
      transform: translateY(-50%) translate(2px, 0);
      box-shadow: 2px 2px 0 var(--tomato);
    }}
    @media (max-width: 720px) {
      body.theme-chalkboard .list-item {
        padding: 14px 48px 14px 14px; gap: 14px;
      }
      body.theme-chalkboard .list-item-img { width: 92px; height: 92px; }
      body.theme-chalkboard .list-item-title { font-size: 24px; }
      body.theme-chalkboard .list-item-desc { display: none; }
      body.theme-chalkboard .list-item::after { right: 14px; }
    }

    /* EMPTY STATE — "the blackboard's clean tonight" chalk message */
    body.theme-chalkboard .empty {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--cream);
      border: 3px solid var(--ink); border-radius: 22px;
      padding: 64px 32px 56px; margin-top: 12px;
      box-shadow: 8px 8px 0 var(--tomato);
      position: relative; overflow: hidden;
    }
    body.theme-chalkboard .empty::before {
      content: "blackboard's clean tonight"; display: block;
      font-family: var(--font-hand); font-weight: 700;
      color: var(--honey); font-size: 34px;
      transform: rotate(-2deg); margin-bottom: 8px;
      text-shadow: 0 0 1px rgba(244,185,68,0.4);
    }
    body.theme-chalkboard .empty h3 { color: var(--cream); font-size: 22px; }
    body.theme-chalkboard .empty p { color: rgba(242,228,196,0.7); }

    /* DARK A-BOARD FOOTER ---------------------------------------------
       Dashed chalk rule along the top, "cheers from us ✦" caveat note
       above the wordmark, clinking-pints doodle bottom-left, sparkle
       cluster top-right. */
    body.theme-chalkboard .footer {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--cream);
      border-top: 3px solid var(--ink);
      padding: 72px 24px 56px;
      position: relative; overflow: hidden;
      margin-top: 56px;
    }
    body.theme-chalkboard .footer::before {
      /* dashed chalk rule along the top */
      content: ""; position: absolute; top: 18px; left: 32px; right: 32px; height: 4px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 4' preserveAspectRatio='none'><path d='M2 2 L10 2 M16 2 L24 2' stroke='%23F2E4C4' stroke-width='1.6' stroke-linecap='round'/></svg>");
      background-size: 30px 4px; background-repeat: repeat-x;
      pointer-events: none;
    }
    body.theme-chalkboard .footer::after {
      /* chalk doodles: clinking pints (bottom-left), sparkle cluster (top-right) */
      content: ""; position: absolute; inset: 0;
      pointer-events: none;
      background-image:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 160' fill='none' stroke='%23F2E4C4' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' opacity='0.36'><g transform='rotate(-8 50 80)'><path d='M28 30 L36 130 L70 130 L78 30 Z'/><path d='M28 30 Q36 26 53 26 Q70 26 78 30'/><path d='M32 50 Q40 46 48 50 Q56 54 64 50 Q70 47 76 50'/><circle cx='50' cy='80' r='2'/><circle cx='58' cy='100' r='2'/></g><g transform='rotate(8 130 80)'><path d='M104 30 L112 130 L146 130 L154 30 Z'/><path d='M104 30 Q112 26 129 26 Q146 26 154 30'/><path d='M108 50 Q116 46 124 50 Q132 54 140 50 Q146 47 152 50'/><circle cx='126' cy='80' r='2'/><circle cx='134' cy='100' r='2'/></g><path d='M86 18 L94 26 M94 18 L86 26' stroke-width='1.6'/><path d='M100 22 L106 16' stroke-width='1.4'/><path d='M82 30 L76 24' stroke-width='1.4'/></svg>"),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 120' fill='none' stroke='%23F2E4C4' stroke-width='1.8' stroke-linecap='round' opacity='0.4'><path d='M30 30 L30 50 M20 40 L40 40' stroke-width='1.6'/><path d='M80 12 L80 28 M72 20 L88 20' stroke-width='1.6'/><path d='M150 50 L150 66 M142 58 L158 58' stroke-width='1.6'/><path d='M52 70 L52 84 M44 77 L60 77' stroke-width='1.6'/><circle cx='110' cy='40' r='3'/><circle cx='126' cy='28' r='2'/></svg>");
      background-position: left 32px bottom 24px, right 32px top 56px;
      background-size: 200px 160px, 180px 110px;
      background-repeat: no-repeat, no-repeat;
    }
    body.theme-chalkboard .footer-wm,
    body.theme-chalkboard .footer-tagline,
    body.theme-chalkboard .footer-links,
    body.theme-chalkboard .footer-meta,
    body.theme-chalkboard .footer p { position: relative; z-index: 1; }
    body.theme-chalkboard .footer-wm {
      color: var(--cream); font-size: clamp(56px, 11vw, 96px); /* impeccable-disable-line design-system-font-size -- the wordmark follows the guide's logo sizes, which let the giant app-footer mark go larger */
      letter-spacing: -0.04em; line-height: 0.85;
      margin-bottom: 14px;
    }
    body.theme-chalkboard .footer-wm::before {
      content: "cheers from us"; display: block;
      font-family: var(--font-hand); font-weight: 700;
      font-size: 26px; color: var(--honey);
      letter-spacing: 0.005em; transform: rotate(-2deg);
      margin-bottom: 8px;
      line-height: 1; text-shadow: 0 0 1px rgba(244,185,68,0.4);
    }
    body.theme-chalkboard .footer-wm .dot { color: var(--tomato); }
    body.theme-chalkboard .footer-tagline {
      color: rgba(242,228,196,0.85); font-family: var(--font-body);
      font-size: 14px; max-width: 42ch; line-height: 1.55;
      margin: 4px auto 26px;
    }
    body.theme-chalkboard .footer-links { gap: 28px; margin-bottom: 18px; }
    body.theme-chalkboard .footer-links a { color: var(--cream); }
    @media (hover: hover){body.theme-chalkboard .footer-links a:hover { color: var(--honey); border-bottom-color: var(--honey); }}
    body.theme-chalkboard .footer-meta { color: rgba(242,228,196,0.55); padding-top: 16px; }
    body.theme-chalkboard .footer p { color: rgba(242,228,196,0.55); }
    /* Doodles tuck into their corners on narrower screens so they never sit
       on the text. */
    @media (max-width: 1100px) {
      body.theme-chalkboard .footer::after { background-position: left 20px bottom 20px, right 20px top 44px; background-size: 150px 120px, 150px 92px; }
    }
    @media (max-width: 768px) {
      /* From 768px the fixed bottom nav shows: extra bottom padding clears it
         (~64px + safe area), and the pints sit centred below the meta line
         rather than on it. */
      body.theme-chalkboard .footer { padding: 64px 20px calc(96px + 112px + env(safe-area-inset-bottom, 0px)); margin-top: 36px; }
      body.theme-chalkboard .footer::after { background-position: center bottom calc(100px + env(safe-area-inset-bottom, 0px)), right 8px top 22px; background-size: 120px 96px, 92px 56px; }
      /* Pages without the bottom nav (the SEO pages) don't need its clearance */
      body.theme-chalkboard .footer.footer--standalone { padding-bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }
      body.theme-chalkboard .footer.footer--standalone::after { background-position: center bottom calc(20px + env(safe-area-inset-bottom, 0px)), right 8px top 22px; }
    }
    @media (max-width: 720px) {
      body.theme-chalkboard .footer-wm::before { font-size: 22px; }
    }

    /* mobile bottom nav on chalkboard goes dark */
    body.theme-chalkboard .mobile-bottom-nav { background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen; border-top-color: var(--ink); }
    body.theme-chalkboard .mobile-nav-item { color: rgba(242,228,196,0.55); }
    body.theme-chalkboard .mobile-nav-item.active { color: var(--honey); }
    body.theme-chalkboard .mobile-nav-item svg { stroke: rgba(242,228,196,0.55); }
    body.theme-chalkboard .mobile-nav-item.active svg { stroke: var(--honey); }
    body.theme-chalkboard .mobile-nav-add-wrap { background: var(--ink); border-color: var(--cream); box-shadow: 3px 3px 0 var(--tomato); }
    body.theme-chalkboard .mobile-nav-add-wrap svg { stroke: var(--honey) !important; }

    /* ===================================================================
       EVENT DETAIL MODAL — full redesign.
       Layout: full-bleed poster up top, dramatic Caveat title underneath,
       a featured WHEN panel (date+time as cream-on-ink chalk numbers),
       cream-pill PRICE and DISTANCE chips, "the bill" description panel
       with caveat heading, "how to find it" map heading + bordered map.
       Scroll: overflow-y auto with sticky tomato ribbon + sticky close.
       =================================================================== */
    body.theme-chalkboard .modal-overlay { padding: 24px 16px; }

    /* All chalkboard modals share these scroll/frame fundamentals.
       Modals use a warm cream background instead of white for a softer
       feel that matches the rest of the A-board surfaces. The native
       scrollbar is hidden — scroll still works, but the rounded ink
       border isn't broken up by a misaligned chrome scroll-track. */
    body.theme-chalkboard .detail-modal,
    body.theme-chalkboard .modal {
      width: 100%;
      max-height: calc(100vh - 48px);
      padding: 0;
      border: 3px solid var(--ink);
      border-radius: 22px;
      background: var(--paper);
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      box-shadow: none;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body.theme-chalkboard .detail-modal { max-width: 640px; }
    body.theme-chalkboard .detail-modal::-webkit-scrollbar,
    body.theme-chalkboard .modal::-webkit-scrollbar { width: 0; height: 0; display: none; }

    /* ── EVENT DETAIL MODAL (has .detail-poster) ───────────────────
       Mirrors the venue sign-up structure:
         - dark ink "header band" (poster + title sit on the dark band)
         - cream rounded info panels in the body
         - dark ink panel at the bottom (Location + map)
       Close button is overlaid on the dark band. */
    body.theme-chalkboard .detail-modal:has(.detail-poster) {
      background: var(--paper);
    }
    /* The dark header band — wraps the poster + title block. Sized to
       cover the 4:3 poster (≈456px for a 608px-wide modal) PLUS the
       title/venue/area/services block beneath it. Uses a CSS variable
       so the noise overlay stays in lock-step. */
    body.theme-chalkboard .detail-modal:has(.detail-poster) {
      --dark-band-h: 760px;
    }
    body.theme-chalkboard .detail-modal:has(.detail-poster)::before {
      content: ""; position: absolute;
      top: 0; left: 0; right: 0; height: var(--dark-band-h);
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      z-index: 0; pointer-events: none;
    }
    body.theme-chalkboard .detail-modal:has(.detail-poster) > * {
      position: relative; z-index: 2;
    }
    body.theme-chalkboard .detail-modal:has(.detail-poster) .modal-close {
      position: absolute;
      top: 18px; right: 18px;
      margin: 0;
      width: 38px; height: 38px;
      background: var(--cream);
      border: 2.5px solid var(--ink);
      box-shadow: none;
      z-index: 20;
    }
    @media (hover: hover){body.theme-chalkboard .detail-modal:has(.detail-poster) .modal-close:hover {
      background: var(--ink); color: var(--honey);
      box-shadow: 2px 2px 0 var(--tomato);
    }}

    body.theme-chalkboard .modal-nav-arrows {
      margin: 14px 28px 0;
      padding: 0 0 14px;
      border-bottom: 0;
      justify-content: flex-start; gap: 10px;
    }
    body.theme-chalkboard .modal-nav-arrow {
      background: var(--cream); border-color: var(--ink);
      width: 32px; height: 32px;
    }
    @media (hover: hover){body.theme-chalkboard .modal-nav-arrow:hover:not([disabled]) {
      background: var(--ink); color: var(--honey);
      box-shadow: 2px 2px 0 var(--tomato);
    }}
    body.theme-chalkboard .modal-nav-count {
      font-family: var(--font-mono); font-size: 11.5px;
      letter-spacing: 0.2em; color: var(--honey);
      text-transform: uppercase;
    }

    body.theme-chalkboard .detail-poster {
      width: calc(100% - 32px);
      margin: 16px 16px 0;
      aspect-ratio: 4 / 3;
      height: auto;
      border-radius: 16px;
      border: 2.5px solid var(--cream);
      object-fit: cover;
      display: block;
    }

    /* Header section — title block + actions, sits on the dark band */
    body.theme-chalkboard .detail-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 16px;
      margin: 18px 28px 24px;
      padding: 0;
    }
    /* The title/venue-link/area share a wrapper div; flatten it so each
       becomes a real grid item — lets the title share row 1 with the
       actions while the venue link + area span the full width below,
       instead of being squeezed into the (now shrinkable) title column. */
    body.theme-chalkboard .detail-header > div:not(.detail-actions) { display: contents; }
    body.theme-chalkboard .detail-title {
      font-family: var(--font-hand); font-weight: 700;
      font-size: 44px; line-height: 0.96; letter-spacing: 0;
      color: var(--cream); margin: 0;
      grid-column: 1;
      min-width: 0; overflow-wrap: break-word;
      text-shadow: 0 0 1px rgba(242,228,196,0.4);
    }
    body.theme-chalkboard .detail-modal .card-venue-link {
      font-family: var(--font-display); font-weight: 700;
      font-size: 22px; color: var(--honey);
      margin: 8px 0 0; grid-column: 1;
      display: inline-block; align-self: start;
      text-decoration-color: var(--honey);
    }
    body.theme-chalkboard .detail-modal .detail-venue-area {
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(242,228,196,0.7);
      margin: 6px 0 0; grid-column: 1 / -1;
      display: block;
    }
    body.theme-chalkboard .detail-modal .detail-venue-services {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin: 16px 28px 0;
    }
    /* These service tags sit on the CREAM info body of the event profile
       (not a chalkboard surface), so they use the .service-tag treatment —
       ink fill + honey text — per BRAND §10, not the transparent mini-tag. */
    body.theme-chalkboard .detail-modal .detail-venue-services .mini-tag {
      font-family: var(--font-display); font-size: 14px; font-weight: 600;
      padding: 6px 16px; border-radius: 100px;
      border: 1.5px solid var(--ink);
      background: var(--ink); color: var(--honey);
      letter-spacing: 0;
      box-shadow: none;
    }
    @media (hover: hover){body.theme-chalkboard .detail-modal .card-venue-link:hover { color: var(--cream); }}
    body.theme-chalkboard .detail-actions {
      grid-column: 2; grid-row: 1;
      display: flex; gap: 8px;
      align-self: start;
    }
    body.theme-chalkboard .detail-action-btn {
      width: 40px; height: 40px;
      background: var(--cream); border: 2.5px solid var(--ink);
      box-shadow: none;
    }
    @media (hover: hover){body.theme-chalkboard .detail-action-btn:hover {
      background: var(--ink); color: var(--honey);
      box-shadow: 2px 2px 0 var(--tomato);
    }}

    /* INFO GRID — four matching cream stat panels (mirrors the
       venue sign-up's 3-up cream stats row). All four cards share
       the same structure: caveat number, mono label. */
    body.theme-chalkboard .detail-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 24px 28px 0;
      background: var(--cream);
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 18px 14px;
    }
    body.theme-chalkboard .detail-info-grid .detail-info-item {
      background: transparent !important;
      border: 0 !important;
      border-radius: 0 !important;
      padding: 6px 12px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 4px !important;
      position: relative;
      overflow: visible !important;
    }
    body.theme-chalkboard .detail-info-grid .detail-info-item::after { display: none; }
    body.theme-chalkboard .detail-info-grid .detail-info-item:nth-child(2),
    body.theme-chalkboard .detail-info-grid .detail-info-item:nth-child(4) {
      border-left: 1.5px dashed rgba(26,23,21,0.25) !important;
    }
    body.theme-chalkboard .detail-info-grid .detail-info-item:nth-child(n+3) {
      border-top: 1.5px dashed rgba(26,23,21,0.25) !important;
      padding-top: 14px !important;
    }
    body.theme-chalkboard .detail-info-grid .detail-info-item .detail-info-label {
      font-family: var(--font-mono) !important; font-size: 10px !important; font-weight: 600 !important;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-soft) !important; margin: 0;
    }
    body.theme-chalkboard .detail-info-grid .detail-info-item .detail-info-value {
      font-family: var(--font-hand) !important; font-weight: 700 !important;
      font-size: 28px !important; color: var(--ink);
      letter-spacing: 0 !important; line-height: 1 !important;
    }

    /* "How it works"-style numbered section labels — caveat headings
       above each content block (matches the venue sign-up rhythm). */
    body.theme-chalkboard .detail-modal h3 {
      font-family: var(--font-hand) !important;
      font-weight: 700; font-size: 28px !important;
      color: var(--ink); letter-spacing: 0;
      margin: 28px 28px 12px !important;
      transform: none; display: block;
    }

    /* Description panel — cream rounded card, with caveat label
       baked in via a section heading rendered before it. */
    body.theme-chalkboard .detail-description {
      background: var(--cream); border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 18px 20px;
      margin: 8px 28px 0;
      font-family: var(--font-body); font-size: 15px;
      line-height: 1.65; color: var(--ink);
      position: relative;
    }

    /* Bottom dark-ink panel housing the map — mirrors the dark form
       panel at the bottom of the venue sign-up modal. */
    body.theme-chalkboard .detail-modal:has(.detail-poster) > .google-map-embed {
      width: calc(100% - 56px);
      margin: 0 28px 28px;
      height: 220px;
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      display: block;
    }

    /* Bottom breathing room */
    body.theme-chalkboard .detail-modal > :last-child { margin-bottom: 28px; }

    @media (max-width: 600px) {
      body.theme-chalkboard .detail-modal { border-radius: 18px; }
      body.theme-chalkboard .detail-modal:has(.detail-poster)::before,
      body.theme-chalkboard .detail-modal:has(.detail-poster)::after { height: 540px; }
      body.theme-chalkboard .detail-poster { aspect-ratio: 4 / 3; height: auto; margin: 14px 14px 0; width: calc(100% - 28px); }
      body.theme-chalkboard .detail-header { margin: 14px 18px 18px; }
      body.theme-chalkboard .detail-title { font-size: 32px; }
      body.theme-chalkboard .detail-info-grid { margin: 18px 18px 0; padding: 14px 8px; }
      body.theme-chalkboard .detail-info-grid .detail-info-item .detail-info-value { font-size: 22px !important; }
      body.theme-chalkboard .detail-description { margin: 8px 18px 0; padding: 16px 18px; }
      body.theme-chalkboard .detail-modal .detail-venue-services { margin: 14px 18px 0; }
      body.theme-chalkboard .detail-modal h3 { margin: 22px 18px 10px !important; font-size: 24px !important; }
      body.theme-chalkboard .detail-modal:has(.detail-poster) > .google-map-embed { width: calc(100% - 36px); margin: 0 18px 22px; height: 180px; }
      body.theme-chalkboard .modal-nav-arrows { margin: 12px 18px 0; }
    }

    /* ===================================================================
       PUB SIGN-UP / GET-LISTED PAGE  (scoped via :has(.get-listed-step))
       =================================================================== */
    body.theme-chalkboard .modal:has(.get-listed-step) {
      max-width: 580px !important;
    }
    body.theme-chalkboard .modal:has(.get-listed-step) .modal-close {
      position: absolute;
      top: 18px; right: 18px;
      margin: 0;
      width: 38px; height: 38px;
      background: var(--cream); border: 2.5px solid var(--ink);
      box-shadow: none;
      z-index: 20;
    }
    @media (hover: hover){body.theme-chalkboard .modal:has(.get-listed-step) .modal-close:hover {
      background: var(--ink); color: var(--honey);
      box-shadow: 2px 2px 0 var(--tomato);
    }}
    /* Dark header band at the top of the get-listed modal — extends edge
       to edge by pulling the sides out past the modal's horizontal padding.
       The modal's overflow + border-radius clip the band's outer corners. */
    body.theme-chalkboard .modal:has(.get-listed-step) > div:first-of-type {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen; color: var(--cream);
      margin: -56px -30px 0 !important;
      padding: 56px 28px 32px !important;
      text-align: center; position: relative; overflow: hidden;
    }
    body.theme-chalkboard .modal:has(.get-listed-step) > div:first-of-type > * { position: relative; z-index: 1; }
    body.theme-chalkboard .modal:has(.get-listed-step) > div:first-of-type div:first-child {
      color: var(--cream) !important;
    }
    body.theme-chalkboard .modal:has(.get-listed-step) > div:first-of-type p:first-of-type {
      color: var(--honey) !important; font-size: 28px !important;
    }
    body.theme-chalkboard .modal:has(.get-listed-step) > div:first-of-type p:last-of-type {
      color: rgba(242,228,196,0.85) !important;
    }


    body.theme-chalkboard .modal:has(.get-listed-step) h3 {
      font-family: var(--font-hand) !important; font-weight: 700 !important;
      font-size: 28px !important; color: var(--ink) !important;

    body.theme-chalkboard .get-listed-step {
      margin: 0 28px 18px !important;
    }
    body.theme-chalkboard .get-listed-step-num {
      width: 38px; height: 38px;
      background: var(--ink); color: var(--honey);
      border: 2.5px solid var(--ink);
      font-family: var(--font-display); font-weight: 700; font-size: 14px;
      letter-spacing: -0.01em;
    }

    /* Sign-up band: a deliberate dark "create your account" zone, flush + edge-
       to-edge, set off from the cream info zone above by a 3px ink rule
       (tomato is never a border here; Guidelines v6). */
    body.theme-chalkboard .modal:has(.get-listed-step) > .get-listed-band {
      background-color: var(--ink) !important; background-image: var(--chalk-noise) !important; background-size: 240px 240px !important; background-blend-mode: screen !important; color: var(--cream) !important;
      border: 0 !important; border-top: 3px solid var(--ink) !important; /* impeccable-disable-line border-accent-on-rounded -- the band's top divider inside the modal, not an accent */
      border-radius: 0 !important;
      /* Modal has 0 padding, so margin 0 = full-width band; the 28px side padding
         insets the labels/inputs so they don't clip against the modal edges. */
      margin: 28px 0 0 !important; padding: 28px 28px 26px !important;
      position: relative;
    }
    body.theme-chalkboard .modal:has(.get-listed-step) .get-listed-step:last-of-type {
      margin-bottom: 4px !important;
    }
    body.theme-chalkboard .modal:has(.get-listed-step) > .get-listed-band > h4 {

      font-size: 28px !important; color: var(--honey) !important;

      display: inline-block; margin-bottom: 16px !important;

    body.theme-chalkboard .contact-form-field label {

      letter-spacing: 0.14em; color: var(--cream);

    body.theme-chalkboard .contact-form-field input,

    body.theme-chalkboard .contact-form-field textarea { border-radius: 14px; min-height: 80px; }
    body.theme-chalkboard .contact-form-field input::placeholder,

    body.theme-chalkboard .contact-form-field input:focus,

    body.theme-chalkboard .modal:has(.get-listed-step) > .get-listed-band .form-submit {

    @media (hover: hover){body.theme-chalkboard .modal:has(.get-listed-step) > .get-listed-band .form-submit:hover {
      box-shadow: 3px 3px 0 var(--tomato);

    }}
    body.theme-chalkboard .modal:has(.get-listed-step) > div:last-of-type {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen; margin: 0 0 0 !important;
      padding: 0 28px 30px !important;

    body.theme-chalkboard .modal:has(.get-listed-step) > div:last-of-type > button {

    @media (max-width: 768px) {

        margin-left: -20px !important;
        margin-right: -20px !important;

      body.theme-chalkboard .modal:has(.get-listed-step) > div:last-of-type {

        padding: 0 28px max(env(safe-area-inset-bottom, 0px), 30px) !important;

    }

    body.theme-chalkboard .modal:has(.login-form) {

    body.theme-chalkboard .modal:has(.login-form) .form-field label {
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;

    body.theme-chalkboard .modal:has(.login-form) .form-field input:focus {
      box-shadow: 3px 3px 0 var(--tomato); border-color: var(--cream);

    body.theme-chalkboard .modal:has(.login-form) .form-error {
      display: block;

    body.theme-chalkboard .modal:has(.login-form) .form-submit {

    @media (hover: hover){body.theme-chalkboard .modal:has(.login-form) .form-submit:hover {
      box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px);
    }}
    /* "or" divider between the OAuth buttons and the email form (mono, as on /login) */
    .login-or { display: flex; align-items: center; gap: 12px; margin: 18px 0; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(242,228,196,0.55); }

    /* ===================================================================
       VENUE PROFILE MODAL  (scoped via :has(.profile-card))
       Mirrors the venue sign-up structure: dark ink "header band" at
       the top wraps the hero image + venue name, cream rounded panels
       in the body, with section caveat headings.

    body.theme-chalkboard .detail-modal:has(.profile-card) {

    body.theme-chalkboard .detail-modal:has(.profile-card)::before {
      content: ""; position: absolute;
      top: 0; left: 0; right: 0; height: 240px;

      z-index: 0; pointer-events: none;

    body.theme-chalkboard .detail-modal:has(.profile-card) > * {

      position: absolute;

      z-index: 20;

    @media (hover: hover){body.theme-chalkboard .detail-modal:has(.profile-card) .modal-close:hover {
      background: var(--ink); color: var(--honey);

    body.theme-chalkboard .profile-card { box-shadow: none; background: transparent; border: 0; }

    /* Menu modal close button sits on the dark ink header. Match the other
       over-dark close buttons above — cream disc, ink X, flat at rest, tomato
       hard-shadow only on hover. */
    body.theme-chalkboard .menu-modal .modal-close {
      width: 38px; height: 38px;
      background: var(--cream); color: var(--ink);
      border: 2.5px solid var(--ink);
      box-shadow: none;
      z-index: 20;
    }
    @media (hover: hover){body.theme-chalkboard .menu-modal .modal-close:hover {
      background: var(--ink); color: var(--honey);
      box-shadow: 3px 3px 0 var(--tomato);
      transform: translate(-1px,-1px);

    body.theme-chalkboard .profile-hero {
      width: calc(100% - 32px);
      margin: 16px 16px 0;
      aspect-ratio: 4 / 3;
      height: auto;

    body.theme-chalkboard .profile-area {

    body.theme-chalkboard .profile-bio {

    body.theme-chalkboard .profile-section-title {
      font-family: var(--font-hand) !important; font-weight: 700;

    }
    body.theme-chalkboard .profile-section-title .scribble {

    body.theme-chalkboard .service-tag {

    body.theme-chalkboard .hours-grid {

    }
    body.theme-chalkboard .profile-link {
      background: var(--ink); color: var(--honey);
      border: 2.5px solid var(--ink);

    }
    @media (hover: hover){body.theme-chalkboard .profile-link:hover {
      background: var(--ink); color: var(--honey);

    /* Your Events table — icon tiles get a cream wash so the chalk
