      border-color: var(--ink);
    }
    @media (max-width: 600px) {
      body.theme-chalkboard .detail-modal:has(.profile-card)::before,
      body.theme-chalkboard .detail-modal:has(.profile-card)::after { height: 200px; }
      body.theme-chalkboard .profile-hero { aspect-ratio: 4 / 3; height: auto; margin: 14px 14px 0; width: calc(100% - 28px); }
      body.theme-chalkboard .profile-body { padding: 14px 18px 22px !important; }
      body.theme-chalkboard .profile-name { font-size: 32px; }
    }

    /* ===================================================================
       CHALK-DUST INK TILE TREATMENT
       Event cards, venue cards, and list-view rows: ink body with the
       same chalk-dust noise overlay used on the hero, accented with a
       soft warm yellow (#FBE3AA) only on the most important elements.
       Body copy stays cream/white; borders stay flat ink.
       =================================================================== */
    body.theme-chalkboard .card,
    body.theme-chalkboard .venue-card,
    body.theme-chalkboard .list-item {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      border-color: var(--ink);
      color: var(--cream);
      position: relative;
    }
    body.theme-chalkboard .card > *,
    body.theme-chalkboard .venue-card > *,
    body.theme-chalkboard .list-item > * {
      position: relative; z-index: 1;
    }

    /* Image bottom border + icon badge re-keyed for the dark tile */
    body.theme-chalkboard .card .card-image,
    body.theme-chalkboard .venue-card .venue-card-img,
    body.theme-chalkboard .list-item .list-item-img {
      border-color: var(--ink);
    }
    body.theme-chalkboard .card .card-icon-badge {
      background: var(--cream);
      border-color: var(--ink);
    }
    body.theme-chalkboard .card .card-image-wrap {
      border-radius: 14px 14px 0 0;
    }

    /* EVENT CARD CONTENT — bright honey title + cat tag (the two
       primary identifiers). Body copy stays cream so the yellow
       doesn't take over. */
    body.theme-chalkboard .card .card-title { color: var(--honey); }
    /* Category tag: inline-style bg/text come from CAT_STYLES per category.
       The grainy black variant (data-tone="ink") gets a subtle noise overlay
       to echo the chalkboard texture without overpowering the honey type. */
    body.theme-chalkboard .card .card-cat-tag {
      border-color: var(--cream);
      box-shadow: none;
      font-weight: 700;
    }
    @media (hover: hover){body.theme-chalkboard .card:hover .card-cat-tag,
    body.theme-chalkboard .list-item:hover .card-cat-tag,
    body.theme-chalkboard .card-cat-tag:hover {
      box-shadow: 2px 2px 0 var(--tomato);
      transform: translate(-1px,-1px);
    }}
    body.theme-chalkboard .card .sport-sub-tag {
      background: transparent; color: var(--cream);
      border-color: var(--cream);
    }
    body.theme-chalkboard .card .card-venue-link {
      color: var(--cream);
      font-size: 14px; font-weight: 700;
      text-decoration-color: rgba(242,228,196,0.55);
    }
    @media (hover: hover){body.theme-chalkboard .card .card-venue-link:hover {
      color: var(--honey); text-decoration-color: var(--honey);
    }}
    body.theme-chalkboard .card .card-venue-area {
      color: rgba(242,228,196,0.7);
    }
    body.theme-chalkboard .card .card-venue-services .mini-tag {
      background: transparent; color: var(--cream); border-color: var(--cream);
    }
    body.theme-chalkboard .card .card-meta { color: rgba(242,228,196,0.85); }
    body.theme-chalkboard .card .card-meta .meta-mono { color: var(--cream); }
    body.theme-chalkboard .card .card-meta span[style*="color: var(--ink)"] { color: var(--honey) !important; }
    /* Card meta is one mono line (Guidelines v6: Meta = JetBrains Mono 600 11.5px), price in honey */
    body.theme-chalkboard .card .card-meta.card-meta-prominent,
    body.theme-chalkboard .card .card-meta.card-meta-prominent .meta-mono { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; }

    /* Save / share badge — cream outline by default; the saved state
       is the only place where the soft yellow accent fills in. */
    body.theme-chalkboard .card .card-badge {
      color: var(--cream);
      border-color: var(--cream);
    }
    @media (hover: hover){body.theme-chalkboard .card .card-badge:hover {
      background: var(--ink); color: var(--honey); border-color: var(--ink);
      box-shadow: 2px 2px 0 var(--tomato);
    }}

    /* VENUE CARD — Caveat name in bright honey, cream body copy */
    body.theme-chalkboard .venue-card .venue-card-name { color: var(--honey); }
    body.theme-chalkboard .venue-card .venue-card-area { color: var(--cream); opacity: 0.8; }
    body.theme-chalkboard .venue-card .venue-card-bio { color: rgba(242,228,196,0.85); }
    body.theme-chalkboard .venue-card .venue-card-services .mini-tag {
      background: transparent; color: var(--cream); border-color: var(--cream);
    }

    /* LIST VIEW ITEM — chalkboard list rows on dark tile */
    body.theme-chalkboard .list-item .list-item-title { color: var(--honey); }
    body.theme-chalkboard .list-item .list-item-venue { color: var(--cream); opacity: 0.92; }
    body.theme-chalkboard .list-item .list-item-area { color: rgba(242,228,196,0.7); }
    body.theme-chalkboard .list-item .list-item-services .mini-tag {
      background: transparent; color: var(--cream); border-color: var(--cream);
    }
    body.theme-chalkboard .list-item .list-item-meta { color: rgba(242,228,196,0.7); }
    body.theme-chalkboard .list-item .list-item-desc { color: rgba(242,228,196,0.7); }
    body.theme-chalkboard .list-item .sport-sub-tag {
      background: transparent; color: var(--cream); border-color: var(--cream);
    }
    /* Arrow disc: an SVG arrow in the brand's 2.4px stroke (honey on ink, ink on cream when hovered) */
    body.theme-chalkboard .list-item::after {
      background-color: var(--ink); border-color: var(--cream);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F4B944' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12h14M13 6l6 6-6 6'/></svg>");
    }
    @media (hover: hover){body.theme-chalkboard .list-item:hover::after {
      background-color: var(--cream); border-color: var(--ink);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231A1715' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12h14M13 6l6 6-6 6'/></svg>");
    }}
    body.theme-chalkboard .list-item .list-item-meta span[style*="color: var(--ink)"],
    body.theme-chalkboard .list-item .list-item-meta span[style*="color: var(--ink)"] {
      color: var(--cream) !important;
    }

    /* Hover shadow on ink tiles — tomato is the page's primary drop
       colour; the black-and-yellow stays in the type/icons. */
    @media (hover: hover){body.theme-chalkboard .card:hover { box-shadow: 6px 6px 0 var(--tomato); }}
    @media (hover: hover){body.theme-chalkboard .venue-card:hover { box-shadow: 6px 6px 0 var(--tomato); }}
    @media (hover: hover){body.theme-chalkboard .list-item:hover { box-shadow: 7px 7px 0 var(--tomato); }}

    /* ===================================================================
       TOUCH-DEVICE INPUT ZOOM PREVENTION
       iOS (Safari + the Capacitor WKWebView) auto-zooms the page when a
       focused text control computes under 16px — and the user is often
       left stuck zoomed-in. Rather than a viewport zoom lock (rejected:
       WCAG 1.4.4, App Review — see viewport comment in layout.tsx), we
       remove the trigger: a 16px floor on text-entry controls, scoped to
       coarse (touch) pointers so the desktop design keeps its exact
       13–15px type. Pinch-zoom stays fully available.
       =================================================================== */
    @media (pointer: coarse) {
      input[type="text"], input[type="email"], input[type="password"],
      input[type="search"], input[type="number"], input[type="tel"],
      input[type="url"], input[type="date"], input[type="time"],
      input:not([type]),
      textarea,
      select {
        font-size: 16px !important;
      }
    }

    /* ===================================================================
       ADD TO CALENDAR + SHARE, CALENDAR TAB
       The bookmark became "Add to calendar"; Saved became Calendar.
       Chalkboard values per the approved mockups (2026-09-16).
       =================================================================== */
    /* Card badges are real buttons now (calendar + share, top right) */
    .card-badge { padding: 0; font: inherit; appearance: none; -webkit-appearance: none; }
    body.theme-chalkboard .card .card-badge { background: transparent; }
    /* v6: honey is never a fill — on = ink fill + honey content, resting flat */
    body.theme-chalkboard .card .card-badge.is-added {
      background: var(--ink); color: var(--honey); border-color: var(--cream);
      box-shadow: none;
    }
    @media (hover: hover){body.theme-chalkboard .card .card-badge.is-added:hover {
      background: var(--ink); color: var(--honey); border-color: var(--cream);
      box-shadow: 2px 2px 0 var(--tomato);
    }}
    body.theme-chalkboard .card .card-badges { gap: 6px; }
    /* Keep the category/sport tags clear of the two badges */
    body.theme-chalkboard .card .card-tag-row { padding-right: 78px; }

    /* Detail view: calendar circle turns "on" once added (v6: ink + honey, flat) */
    body.theme-chalkboard .detail-action-btn.added {
      background: var(--ink); color: var(--honey); border-color: var(--cream);
      box-shadow: none;
    }

    /* ---- "which calendar?" picker (web) ---- */
    .cal-sheet {
      width: 100%; max-width: 420px;
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--cream);
      border: 3px solid var(--ink); border-radius: 22px;
      padding: 22px;
    }
    .cal-sheet-title { font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; color: var(--honey); margin: 0 0 4px; }
    .cal-sheet-sub { font-family: var(--font-body); font-size: 14px; color: rgba(242,228,196,0.85); margin: 0 0 16px; }
    .cal-sheet-option {
      display: flex; align-items: center; gap: 12px;
      background: var(--cream); color: var(--ink); text-decoration: none;
      border: 2.5px solid var(--ink); border-radius: 14px;
      padding: 11px 14px; margin-bottom: 10px;
      font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.2;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    @media (hover: hover){.cal-sheet-option:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    .cal-sheet-option:focus-visible { outline: none; box-shadow: 3px 3px 0 var(--tomato); }
    .cal-sheet-option-text small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--grey-600); }
    .cal-sheet-logo {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; border: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 14px; font-weight: 600; background: var(--paper);
    }
    .cal-sheet-arrow { margin-left: auto; opacity: 0.55; flex-shrink: 0; }
    .cal-sheet-cancel {
      display: block; margin: 4px auto 0; padding: 8px 12px; background: none; border: 0; cursor: pointer;
      font-family: var(--font-display); font-weight: 600; font-size: 14px; color: rgba(242,228,196,0.7);
      text-decoration: underline dotted; text-underline-offset: 3px;
    }

    /* ---- Remove from Keggo calendar ---- */
    .cal-remove {
      width: 100%; max-width: 420px;
      background-color: var(--paper); background-image: var(--paper-noise); background-size: 240px 240px; color: var(--ink);
      border: 3px solid var(--ink); border-radius: 22px;
      padding: 22px;
    }
    .cal-remove-title { font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; margin: 0 0 8px; color: var(--ink); }
    .cal-remove-body { font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 18px; }
    .cal-remove-btns { display: flex; gap: 10px; }
    .cal-remove-btns > button { flex: 1 1 auto; justify-content: center; white-space: nowrap; }

    @media (max-width: 768px) {
      /* Sits above the bottom nav like the other chalkboard sheets */
      .cal-sheet, .cal-remove { max-width: 100%; margin-bottom: max(env(safe-area-inset-bottom, 0px), 8px); }
    }

    /* ---- Calendar tab ---- */
    .cal-view { padding-bottom: 40px; }
    .cal-view-head { padding-top: 32px; margin-bottom: 24px; }
    .cal-view-title { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -0.025em; line-height: 1; margin-bottom: 10px; }
    .dash-welcome-name { font-size: 36px; }
    .cal-view-title span { color: var(--tomato); }
    /* Page title (Guidelines v6 §03): Fredoka 700, 36px, 28px on phones */
    @media (max-width: 600px) { .cal-view-title { font-size: 28px; } }
    .cal-view-sub { font-family: var(--font-body); font-size: 15px; line-height: 1.55; color: var(--ink-soft); max-width: 52ch; }
    .cal-group { margin-bottom: 32px; }
    .cal-group-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-soft); margin-bottom: 14px; }
    .cal-group-label span { color: var(--grey-600); margin-left: 8px; }
    .cal-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 10px 18px; }
    .cal-group.is-past .cal-card-title, .cal-group.is-past .cal-stub b { color: rgba(242,228,196,0.7); }
    .cal-group.is-past .cal-card-meta, .cal-group.is-past .cal-stub span { color: rgba(242,228,196,0.7); }
    .cal-row { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 10px; cursor: pointer; }
    .cal-stub,
    .cal-card {
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      border: 2px solid var(--ink); border-radius: 14px; color: var(--cream);
      transition: box-shadow var(--transition), transform var(--transition);
    }
    .cal-stub { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6px 0; }
    .cal-stub span { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(242,228,196,0.7); line-height: 1.3; }
    .cal-stub b { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; color: var(--honey); }
    .cal-card { position: relative; padding: 11px 54px 11px 14px; min-width: 0; }
    @media (hover: hover){.cal-row:hover .cal-card { box-shadow: 5px 5px 0 var(--tomato); transform: translate(-1px,-1px); }}
    .cal-card-title { font-family: var(--font-hand); font-weight: 700; font-size: 26px; line-height: 1.05; color: var(--honey); overflow-wrap: break-word; }
    .cal-card-meta { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: rgba(242,228,196,0.85); margin-top: 3px; }
    .cal-card-badge {
      position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: 50%; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--ink); color: var(--honey); border: 1.5px solid var(--cream);
      transition: box-shadow var(--transition);
    }
    @media (hover: hover){.cal-card-badge:hover { box-shadow: 2px 2px 0 var(--tomato); }}
    .cal-card-badge:focus-visible { outline: none; box-shadow: 3px 3px 0 var(--tomato); }

    /* Empty Calendar tab — reuses the chalk empty panel with its own line */
    body.theme-chalkboard .empty.empty-calendar::before { content: "blackboard's clean"; }
    .empty-calendar .empty-cta {
      margin-top: 20px; padding: 11px 22px; cursor: pointer;
      background: var(--cream); color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 100px;
      font-family: var(--font-display); font-size: 14px; font-weight: 700;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    @media (hover: hover){.empty-calendar .empty-cta:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}

    /* ===================================================================
       PART 2 — "DID YOU MAKE IT?" + CREATE-ACCOUNT NUDGE
       Sheets sit on the paper ground; the question card is a cream-on-ink
       sticker with the tomato drop. Per the approved mockups (2026-09-16).
       =================================================================== */
    .acct-sheet {
      width: 100%; max-width: 420px;
      background-color: var(--paper); background-image: var(--paper-noise); background-size: 240px 240px; color: var(--ink);
      border: 3px solid var(--ink); border-radius: 22px;
      padding: 22px;
    }
    .acct-sheet-title { font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; margin: 0 0 8px; color: var(--ink); }
    .acct-sheet-body { font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 18px; }

    /* ---- Create-account nudge ---- */
    .acct-reasons { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 9px; }
    .acct-reasons li { display: flex; align-items: center; gap: 10px; font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink-soft); }
    .acct-reason-icon {
      width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px;
      background: var(--cream); border: 2px solid var(--ink); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
    }
    .acct-sheet-btns { display: grid; gap: 10px; }
    .acct-sheet-btns .btn-primary,
    .acct-sheet-btns .btn-ghost { width: 100%; justify-content: center; text-align: center; display: flex; }
    .acct-sheet-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; }
    .acct-link {
      background: none; border: 0; cursor: pointer; padding: 4px 2px;
      font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--grey-600);
      text-decoration: underline dotted; text-underline-offset: 3px;
    }
    @media (hover: hover){.acct-link:hover { color: var(--ink); }}

    /* ---- "did you make it?" card ---- */
    .dym {
      width: 100%; max-width: 420px; text-align: center;
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--cream);
      border: 3px solid var(--ink); border-radius: 22px;
      box-shadow: none;
      padding: 22px;
    }
    .dym-kicker { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(242,228,196,0.7); }
    .dym-title { font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; color: var(--honey); margin: 6px 0 14px; }
    .dym-event {
      display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
      background: var(--cream); color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px; margin-bottom: 16px;
    }
    .dym-event img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 2px solid var(--ink); display: block; }
    .dym-event b { font-family: var(--font-hand); font-weight: 700; font-size: 28px; line-height: 1.05; display: block; }
    .dym-event span { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey-600); }
    .dym-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dym-answers.dym-answers--single { grid-template-columns: 1fr; }
    .dym-answers .btn-primary,
    .dym-answers .btn-ghost { width: 100%; justify-content: center; text-align: center; display: flex; }
    body.theme-chalkboard .dym .btn-primary { background: var(--ink); color: var(--honey); border-color: var(--cream); box-shadow: none; }
    body.theme-chalkboard .dym .btn-ghost { background: transparent; color: var(--cream); border: 1.5px solid var(--cream); }
    @media (hover: hover){body.theme-chalkboard .dym .btn-ghost:hover { background: var(--cream); color: var(--ink); }}
    .dym-fine { font-family: var(--font-body); font-size: 14px; color: rgba(242,228,196,0.55); margin: 12px 0 0; }
    .dym-thanks { font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: rgba(242,228,196,0.85); margin: 0 0 16px; }
    .dym-thanks b { color: var(--honey); }
    .dym-stamp {
      width: 64px; height: 64px; border-radius: 50%; margin: 4px auto 10px;
      background: var(--ink); border: 2.5px solid var(--cream); color: var(--honey);
      display: flex; align-items: center; justify-content: center;
      box-shadow: none;
    }
    .dym-close {
      background: none; border: 0; cursor: pointer; padding: 6px;
      font-family: var(--font-display); font-weight: 600; font-size: 14px; color: rgba(242,228,196,0.7);
      text-decoration: underline dotted; text-underline-offset: 3px;
    }

    /* ---- Website: the same question as a banner above the results ---- */
    .att-banner {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--cream);
      border: 2.5px solid var(--ink); border-radius: 18px;
      box-shadow: none;
      padding: 14px 16px; margin: 0 0 18px;
    }
    .att-banner-q { flex: 1 1 220px; min-width: 0; }
    .att-banner-q b { font-family: var(--font-hand); font-size: 28px; line-height: 1; color: var(--honey); display: block; }
    .att-banner-q span { font-family: var(--font-body); font-size: 14px; color: rgba(242,228,196,0.85); }
    .att-banner-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    body.theme-chalkboard .att-banner .btn-primary { background: var(--ink); color: var(--honey); border-color: var(--cream); box-shadow: none; padding: 10px 16px; font-size: 14px; }
    body.theme-chalkboard .att-banner .btn-ghost { background: transparent; color: var(--cream); border: 1.5px solid var(--cream); padding: 10px 16px; font-size: 14px; }
    @media (hover: hover){body.theme-chalkboard .att-banner .btn-ghost:hover { background: var(--cream); color: var(--ink); }}
    .att-banner-x {
      width: 32px; height: 32px; border-radius: 50%; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--cream); border: 1.5px solid var(--cream);
    }
    @media (hover: hover){.att-banner-x:hover { background: var(--cream); color: var(--ink); }}

    /* ---- Calendar tab: ask / answered on past rows ---- */
    .cal-ask {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px;
      font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--cream);
    }
    .cal-ask-q { flex-basis: 100%; }
    .cal-ask button {
      font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1;
      padding: 6px 16px; border-radius: 100px; cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .cal-ask-yes { background: var(--ink); color: var(--honey); border: 1.5px solid var(--cream); }
    .cal-ask-no { background: transparent; color: var(--cream); border: 1.5px solid var(--cream); }
    @media (hover: hover){.cal-ask button:hover { transform: translate(-1px,-1px); box-shadow: 2px 2px 0 var(--tomato); }}
    .cal-answered {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--honey); border: 1.5px solid var(--honey); border-radius: 100px; padding: 3px 9px;
    }
    .cal-answered.is-no { color: rgba(242,228,196,0.7); border-color: rgba(242,228,196,0.22); }

    @media (max-width: 768px) {
      .acct-sheet, .dym { max-width: 100%; margin-bottom: max(env(safe-area-inset-bottom, 0px), 8px); }
      .dym-answers { grid-template-columns: 1fr; }
    }

    /* ===================================================================
       PART 3 — FOLLOW A PUB
       Honey "Follow" pill (the loudest thing on the pub profile), calming to
       an ink "Following" with a tick. Mini version sits after the venue
       button on the event detail. Per the approved mockups (2026-09-16).
       =================================================================== */
    .follow-btn {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      font-family: var(--font-display); font-weight: 700; line-height: 1;
      background: var(--card); color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 100px;
      box-shadow: none;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition);
    }
    @media (hover: hover){.follow-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    .follow-btn:focus-visible { outline: none; box-shadow: 3px 3px 0 var(--tomato); }
    .follow-btn--full { font-size: 14px; padding: 10px 18px; }
    /* mini sits on the detail modal's dark band: off = cream outline */
    .follow-btn--mini { font-size: 14px; padding: 7px 12px; background: transparent; color: var(--cream); border-color: var(--cream); }
    .follow-btn.is-following {
      background: var(--ink); color: var(--honey); border-color: var(--ink); box-shadow: none;
    }
    .follow-btn--mini.is-following { border-color: var(--cream); }
    @media (hover: hover){.follow-btn.is-following:hover { box-shadow: 2px 2px 0 var(--tomato); }}

    .profile-follow-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 8px; }

    /* Event detail: venue button + mini Follow share a row */
    .detail-venue-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; grid-column: 1 / -1; }
    body.theme-chalkboard .detail-modal .detail-venue-row .venue-link-btn { margin: 0; }
    body.theme-chalkboard .detail-modal .detail-venue-row { margin-top: 10px; }

    /* Calendar tab: "Your pubs" strip */
    /* Your pubs (Guidelines v6 §10): wrapping pills — a 30px photo or initial
       disc and the full name; flat, 3px lift on hover. */
    .your-pubs { display: flex; flex-wrap: wrap; gap: 10px; }
    .your-pub {
      display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
      background: var(--card); border: 2.5px solid var(--ink); border-radius: 100px;
      padding: 4px 16px 4px 4px; cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    @media (hover: hover){.your-pub:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    .your-pub img,
    .your-pub-blank {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      border: 2px solid var(--ink); box-sizing: border-box;
    }
    .your-pub-blank {
      display: flex; align-items: center; justify-content: center;
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--honey); font-family: var(--font-hand); font-weight: 700; font-size: 20px;
      /* Caveat capitals sit ~0.12em right of their box: offset so the
         initial is optically centred at any size. */
      line-height: 1; padding: 0 0.23em 0.02em 0;
    }
    /* A venue with no photo: its initial in a grainy-ink disc on the cream
       fallback ground (same disc as Your pubs, at icon-badge size). */
    .venue-img-fallback,
    body.theme-chalkboard .venue-img-fallback { display: flex; align-items: center; justify-content: center; background: var(--cream); }
    .venue-initial {
      width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: var(--border-w) solid var(--ink); box-sizing: border-box;
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--honey); font-family: var(--font-hand); font-weight: 700; font-size: 34px;
      line-height: 1; padding: 0 0.23em 0.02em 0;
    }
    .your-pub-name {
      font-family: var(--font-display); font-weight: 600; font-size: 14px; line-height: 1.2; color: var(--ink);
      max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── Report this listing (event detail) ──
       The link sits under the map; the sheet is paper with ink type in every
       theme (chalkboard included), and the chosen reason turns honey. */
    .report-listing-link {
      background: none; border: none; cursor: pointer; padding: 4px 6px;
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--grey-600); text-decoration: underline dotted; text-underline-offset: 3px;
    }
    @media (hover: hover){.report-listing-link:hover { color: var(--ink); }}
    .report-overlay { z-index: 10001; }
    .report-sheet {
      position: relative; width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
      border: 3px solid var(--ink); border-radius: 22px; box-shadow: none;
      padding: 22px; color: var(--ink);
    }
    .report-sheet-close {
      position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: var(--cream); border: 2.5px solid var(--ink); border-radius: 50%; color: var(--ink); cursor: pointer;
    }
    .report-sheet-title { font-family: var(--font-hand); font-weight: 700; font-size: 34px; line-height: 1; color: var(--ink); margin: 0 40px 6px 0; }
    .report-sheet-sub { font-family: var(--font-body); font-size: 14px; line-height: 1.5; color: var(--ink); margin: 0 0 16px; }
    .report-reasons { display: flex; flex-direction: column; gap: 8px; }
    .report-reason {
      text-align: left; width: 100%; padding: 11px 16px; cursor: pointer;
      background: var(--cream); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 14px;
      font-family: var(--font-display); font-weight: 600; font-size: 14px;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    @media (hover: hover){.report-reason:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    .report-reason.selected { background: var(--ink); color: var(--honey); box-shadow: 3px 3px 0 var(--tomato); }
    .report-note-label { display: block; margin: 14px 0 6px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
    .report-note {
      display: block; width: 100%; margin-top: 0; padding: 11px 14px; resize: vertical;
      background: var(--card); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 14px; min-height: 80px;
      font-family: var(--font-body); font-size: 14px; font-weight: 500; line-height: 1.45;
    }
    .report-note::placeholder { color: var(--grey-400); }
    .report-note:focus { outline: none; box-shadow: 3px 3px 0 var(--tomato); }
    /* paper sheet: errors use the form-error pill */
    .report-error { margin: 10px 0 0; display: inline-block; font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--honey); background: var(--ink); border: 1.5px solid var(--ink); border-radius: 100px; padding: 3px 10px; }
    .report-error:empty { display: none; }
    .report-submit {
      width: 100%; margin-top: 14px; padding: 12px 24px; cursor: pointer;
      background: var(--ink); border: 2.5px solid var(--ink); border-radius: 100px; box-shadow: none;
      font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--honey);
      transition: transform var(--transition), box-shadow var(--transition);
    }
    @media (hover: hover){.report-submit:hover:not(:disabled) { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--tomato); }}
    .report-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    @media (max-width: 768px) {
      .report-sheet {
        max-width: 100%; box-shadow: none;
        margin-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
      }
    }

    /* ---- Waitlist (WaitlistBanner.tsx): keggo.app only, never the native apps ---- */
    .waitlist {
      display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: center;
      background-color: var(--ink); background-image: var(--chalk-noise); background-size: 240px 240px; background-blend-mode: screen;
      color: var(--cream);
      border: 2.5px solid var(--ink); border-radius: 18px;
      padding: 22px 24px; margin: 0 0 22px;
    }
    .waitlist-copy { flex: 1 1 240px; min-width: 0; }
    .waitlist-form { flex: 1 1 300px; min-width: 0; margin: 0; }
    .waitlist-scribble {
      font-family: var(--font-hand); font-weight: 700; font-size: 26px; line-height: 1; color: var(--honey);
      transform: rotate(-2deg); transform-origin: left center; margin: 0;
    }
    .waitlist-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: -0.02em; color: var(--cream); margin: 8px 0 6px; }
    .waitlist-body { font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: rgba(242,228,196,0.85); margin: 8px 0 0; max-width: 60ch; }
    .waitlist-copy .waitlist-title + .waitlist-body { margin-top: 0; }
    .waitlist-body b { color: var(--cream); font-weight: 600; overflow-wrap: anywhere; }
    .waitlist a { color: var(--honey); text-decoration: underline; text-underline-offset: 3px; }
    .waitlist-label {
      display: block; font-family: var(--font-mono); font-weight: 600; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--cream); margin: 0 0 6px;
    }
    .waitlist-kinds { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    .waitlist-kind {
      padding: 8px 18px; border-radius: 100px; border: 2.5px solid var(--cream); background: transparent; color: var(--cream);
      font-family: var(--font-display); font-weight: 600; font-size: 14px; cursor: pointer; transition: all var(--transition);
    }
    .waitlist-kind.active { background: var(--ink); color: var(--honey); box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px); }
    @media (hover: hover){.waitlist-kind:not(.active):hover { box-shadow: 3px 3px 0 var(--tomato); transform: translate(-1px,-1px); }}
    .waitlist-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .waitlist-input {
      flex: 1 1 200px; min-width: 0; padding: 11px 16px; border-radius: 100px;
      border: 2.5px solid var(--cream); background: transparent; color: var(--cream);
      font-family: var(--font-body); font-weight: 500; font-size: 14px;
    }
    .waitlist-input::placeholder { color: rgba(242,228,196,0.55); }
    .waitlist-input:focus { outline: none; box-shadow: 3px 3px 0 var(--tomato); }
    body.theme-chalkboard .waitlist .btn-primary { border-color: var(--cream); white-space: nowrap; }
    body.theme-chalkboard .waitlist .btn-primary:disabled { opacity: 0.4; transform: none; box-shadow: none; cursor: default; }
    .waitlist-error { font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--honey); margin: 10px 0 0; }
    .waitlist-fine { font-family: var(--font-body); font-size: 14px; color: rgba(242,228,196,0.7); margin: 10px 0 0; }
    .waitlist-link {
      background: none; border: 0; padding: 0; cursor: pointer;
      font: inherit; color: var(--honey); text-decoration: underline; text-underline-offset: 3px;
    }
    /* The gate's pub section: its own block under a dashed chalk rule. */
    .waitlist-pub { margin-top: 18px; padding-top: 16px; border-top: 2px dashed rgba(242,228,196,0.22); }
    .waitlist-pub .waitlist-scribble { font-size: 22px; }
    .waitlist-pub .waitlist-body { margin-top: 6px; }
    .waitlist-pub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 12px; }
    .waitlist-pub-row .waitlist-fine { margin: 0; }
    body.theme-chalkboard .waitlist .btn-ghost {
      display: inline-flex; justify-content: center; text-decoration: none; white-space: nowrap;
      background: transparent; color: var(--cream); border-color: var(--cream);
    }
    @media (hover: hover){body.theme-chalkboard .waitlist .btn-ghost:hover { background: transparent; color: var(--cream); }}
    /* The gate: a window over Explore that can't be closed. It sits under the
       sticky header (z 100) and the mobile bottom nav (z 200) so both stay
       usable, and under every modal (z 10000) so sign-in opens on top. */
    .waitlist-gate {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(26,23,21,0.55); backdrop-filter: blur(2px);
      display: flex; padding: 96px 16px 32px; overflow-y: auto;
    }
    .waitlist.waitlist--gate {
      width: 100%; max-width: 460px; margin: auto;
      border-width: 3px; border-radius: 22px; padding: 24px;
    }
    html.waitlist-gated { overflow: hidden; }
    @media (max-width: 768px) {
      .waitlist-gate { padding: 84px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
      .waitlist.waitlist--gate { padding: 20px; }
    }
    .waitlist-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    @media (max-width: 600px) {
      .waitlist { padding: 18px; }
      .waitlist-row .btn-primary, .waitlist-pub-row .btn-ghost { flex: 1 1 100%; justify-content: center; }
    }

    /* Hidden inside the native iOS/Android app: venue pricing and sign-up must
       not appear there (App Store 3.1.1 / Play payments policy). The class is
       set on <html> before first paint (layout.tsx) and again by NativeShell. */
    html.native-app .web-only { display: none !important; }

/* ============================================================
   Standalone hand-built surfaces — chalkboard overrides.

   The auth, error/404 and admin screens are NOT part of the ported
   demo (KeggoV3.html). They're built with Tailwind + the shared pill
   controls (.btn-primary / .btn-pill / .btn-ghost / .input-pill),
   which are styled for the LIGHT theme. On a dark chalkboard surface
   those controls need a cream edge + cream text to read — exactly how
   the in-app search/login chrome works in keggo.css.

   Loaded AFTER keggo.css (see layout.tsx) so these unlayered rules win
   over the unlayered demo rules. Scope: anything inside a
   `.theme-dark-surface` wrapper. Tokens come from keggo.css :root.
   ============================================================ */

.theme-dark-surface .input-pill {
  background: transparent;
  color: var(--cream);
  border-color: var(--cream);
}
.theme-dark-surface .input-pill::placeholder {
  color: rgba(242, 228, 196, 0.55);
}
.theme-dark-surface .input-pill:focus {
  box-shadow: 3px 3px 0 var(--tomato);
}
.theme-dark-surface .input-label {
  color: var(--cream);
}

/* Primary CTA keeps its ink fill + honey text — it just needs a cream
   edge so it doesn't vanish into the ink panel. */
.theme-dark-surface .btn-primary {
  border-color: var(--cream);
}

/* Secondary pills invert to transparent + cream on dark. */
.theme-dark-surface .btn-pill,
.theme-dark-surface .btn-ghost {
  background: transparent;
  color: var(--cream);
  border-color: var(--cream);
}
/* Hover = tomato hard-shadow lift, matching .btn-ghost — never a tomato fill
   (tomato backgrounds are .btn-danger only, Brand Guidelines §14). */
@media (hover: hover){.theme-dark-surface .btn-pill:hover {
  background: transparent;
  color: var(--cream);
  border-color: var(--cream);
  box-shadow: 3px 3px 0 var(--tomato);
}}
@media (hover: hover){.theme-dark-surface .btn-ghost:hover {
  background: transparent;
  color: var(--cream);
  border-color: var(--cream);
  box-shadow: 3px 3px 0 var(--tomato);
}}


/* keggodemo.com only: the DEMO badge beside the wordmark (a mono tag on ink). */
.header .beta-tag { display: inline-block; margin-left: 8px; vertical-align: middle; padding: 3px 10px; border: 1.5px solid var(--cream); border-radius: 100px; background: transparent; color: var(--honey); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; line-height: 1.2; text-transform: uppercase; }
/* Google and Apple sign-in are switched off in the demo: the guide's disabled look. */
.oauth-btn:disabled, .acct-sheet-btns button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
